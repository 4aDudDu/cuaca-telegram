name: Cek Cuaca Otomatis

on:
  schedule:
    # Cek perintah /cuaca & peringatan hujan setiap 5 menit
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install library requests
        run: pip install requests

      - name: Jalankan Script Cek Cuaca
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python cek_cuaca.py
